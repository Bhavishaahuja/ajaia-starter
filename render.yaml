# Render Blueprint for the backend. Render dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: ajaia-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
